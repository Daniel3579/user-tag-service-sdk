syntax = "proto3";

option go_package = "./gen;user_tag_pb";

import "user_tag_requests.proto";
import "user_tag_responses.proto";

service UserTagService {
    rpc Create (UserTag) returns (UserTag);
    rpc ReadTagMultiple (UserIdRequest) returns (MultipleTagResponse);
    rpc ReadUserMultiple (TagIdRequestMultiple) returns (MultipleUserResponse);
    rpc Delete (UserTag) returns (UserTag);
    rpc DeleteMultiple (UserIdRequest) returns (MultipleTagResponse);
}

message UserTag {
    int32 user_id = 1;
    int32 tag_id = 2;
}